name: Monitor official sources

on:
  schedule:
    - cron: "17 19 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate catalogue data
        run: npm run validate:data
      - name: Check download pages and releases
        id: source-check
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_CHECK_REPORT: ${{ runner.temp }}/adfree-source-check.json
        run: npm run check:sources
      - name: Create or update review issue
        if: steps.source-check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_PATH: ${{ runner.temp }}/adfree-source-check.json
        run: |
          node scripts/render-source-issue.mjs "$REPORT_PATH" > "$RUNNER_TEMP/source-review.md"
          issue_number=$(gh issue list --state open --search 'in:title "자동 출처 점검: 재검토 필요"' --json number --jq '.[0].number // empty')
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --body-file "$RUNNER_TEMP/source-review.md"
          else
            gh issue create --title "자동 출처 점검: 재검토 필요" --body-file "$RUNNER_TEMP/source-review.md"
          fi
      - name: Fail when review is required
        if: steps.source-check.outcome == 'failure'
        run: exit 1
